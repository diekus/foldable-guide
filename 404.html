<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not available · Foldable Guide</title>
  <meta name="color-scheme" content="light dark">
  <!--
    This page is used both as the offline fallback (served by sw.js) and as
    the GitHub Pages 404. It can be served from any path, so its styles are
    inlined instead of linked with relative URLs.
  -->
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f6ff; --surface: #ffffff; --text: #1e1f2e; --muted: #545773;
      --border: #c9cbe8; --accent: #4a52d9; --accent-contrast: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11121d; --surface: #1a1b2b; --text: #e9eaf7; --muted: #a9acc8;
        --border: #3d4060; --accent: #9aa1ff; --accent-contrast: #0d0f2a;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center; padding: 1rem;
      background: var(--bg); color: var(--text);
      font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 32rem; padding: 2rem; text-align: center;
      background: var(--surface); border: 1px solid var(--border); border-radius: 0.75rem;
    }
    h1 { font-size: 1.75rem; line-height: 1.2; margin-bottom: 0.75rem; }
    p { color: var(--muted); }
    a.button {
      display: inline-block; margin-top: 1.5rem; padding: 0.6rem 1.2rem;
      background: var(--accent); color: var(--accent-contrast);
      border-radius: 0.375rem; text-decoration: none; font-weight: 600;
    }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Page not available</h1>
    <p>This page doesn't exist, or it isn't available offline. Check your connection, or go back to the Posture Inspector, which works offline.</p>
    <a class="button" href="/" data-home>Go to the Posture Inspector</a>
  </main>
  <script>
    // Point the link at the app's real root (e.g. /foldable-guide/ on GitHub Pages).
    navigator.serviceWorker?.getRegistration().then((reg) => {
      if (reg) document.querySelector('[data-home]').href = reg.scope;
    });
  </script>
</body>
</html>
